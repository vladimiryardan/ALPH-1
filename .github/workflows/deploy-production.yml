name: Deploy AtticLadderPH Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: atticladderph-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Linode
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout application
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.LINODE_SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.LINODE_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/linode
          chmod 600 ~/.ssh/linode
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Test SSH connection
        env:
          SSH_HOST: ${{ secrets.LINODE_HOST }}
        run: |
          ssh -i ~/.ssh/linode root@"$SSH_HOST" \
            "echo 'SSH connection successful'"

      - name: Prepare release
        env:
          SSH_HOST: ${{ secrets.LINODE_HOST }}
        run: |
          ssh -i ~/.ssh/linode root@"$SSH_HOST" "
            set -e

            rm -rf /tmp/atticladderph-release
            mkdir -p /tmp/atticladderph-release

            rm -rf /var/backups/atticladderph-previous
            mkdir -p /var/backups/atticladderph-previous

            rsync -a \
              /var/www/atticladderph/ \
              /var/backups/atticladderph-previous/
          "

      - name: Upload application
        env:
          SSH_HOST: ${{ secrets.LINODE_HOST }}
        run: |
          rsync -az --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.vscode' \
            --exclude='server.json' \
            -e "ssh -i ~/.ssh/linode" \
            ./ root@"$SSH_HOST":/tmp/atticladderph-release/

      - name: Deploy application
        env:
          SSH_HOST: ${{ secrets.LINODE_HOST }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/linode root@"$SSH_HOST" "
            set -e

            rsync -a --delete \
              --exclude='server.json' \
              --exclude='uploads/quote-requests/' \
              /tmp/atticladderph-release/ \
              /var/www/atticladderph/

            chown -R www-data:www-data /var/www/atticladderph

            printf '%s\n' '$GITHUB_SHA' \
              > /var/www/atticladderph/.deployed-commit

            chown www-data:www-data \
              /var/www/atticladderph/.deployed-commit

            systemctl restart commandbox-atticladderph
          "

      - name: Production smoke tests
        id: health
        continue-on-error: true
        run: |
          for attempt in {1..30}; do
            if ./scripts/production-smoke-test.sh; then
              exit 0
            fi

            echo "Smoke test attempt $attempt failed; retrying..."
            sleep 2
          done

          exit 1

      - name: Roll back failed deployment
        if: steps.health.outcome == 'failure'
        env:
          SSH_HOST: ${{ secrets.LINODE_HOST }}
        run: |
          ssh -i ~/.ssh/linode root@"$SSH_HOST" "
            set -e

            rsync -a --delete \
              /var/backups/atticladderph-previous/ \
              /var/www/atticladderph/

            chown -R www-data:www-data /var/www/atticladderph
            systemctl restart commandbox-atticladderph

            for attempt in {1..30}; do
              if curl -fsS \
                -H 'Host: atticladderph.com' \
                http://127.0.0.1/ \
                >/dev/null; then
                exit 0
              fi

              sleep 2
            done

            echo 'Rollback health check failed'
            exit 1
          "

      - name: Fail workflow after rollback
        if: steps.health.outcome == 'failure'
        run: |
          echo "Deployment failed. Previous production release was restored."
          exit 1

      - name: Verify deployed commit
        if: steps.health.outcome == 'success'
        env:
          SSH_HOST: ${{ secrets.LINODE_HOST }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/linode root@"$SSH_HOST" \
            "test \"\$(cat /var/www/atticladderph/.deployed-commit)\" = '$GITHUB_SHA'"

      - name: Cleanup
        if: always()
        env:
          SSH_HOST: ${{ secrets.LINODE_HOST }}
        run: |
          ssh -i ~/.ssh/linode root@"$SSH_HOST" \
            "rm -rf /tmp/atticladderph-release" || true